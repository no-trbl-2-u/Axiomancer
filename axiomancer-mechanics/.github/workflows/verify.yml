name: verify

# Verify-on-PR / verify-on-push gate. Runs `npm run verify` (type-check +
# tests + build) followed by `npm run deploy:check` (4 structural
# assertions: dist/ presence, types.d.ts count, tag/CHANGELOG agreement,
# public-surface drift) on every PR against main + every push to main.
#
# The autonomous-beast loop (.github/workflows/march.yml) runs verify
# before every commit, so today's risk is low — but any human-PR or
# one-off branch contribution lands here for a remote red/green signal
# before merge. Phase 56 closes the gap critique-13 / expand-pass-13
# flagged.
#
# No publish step — that's manual + attended per RELEASING.md.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Cancel in-progress runs on the same branch / PR — force-pushes
  # otherwise pile up identical work.
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full depth — `npm run deploy:check` runs
          # `git describe --tags --abbrev=0` to validate the
          # tag/CHANGELOG agreement (Phase 52 unit 2).
          fetch-depth: 0
          # actions/checkout@v4 uses --no-tags internally even with
          # fetch-depth: 0; fetch-tags: true forces all remote tags down.
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify (type-check + tests + build)
        run: npm run verify

      - name: Deploy check (4 structural assertions)
        run: npm run deploy:check
