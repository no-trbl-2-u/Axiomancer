name: combat-ux-tuning

# Manual autonomous combat-UX tuning pass. This runs the repo-local
# `skills/combat-ux-tuning.md` contract through Claude Code, measuring input
# friction on the Hazard-style combat board, attempting one small A/B UI change
# when warranted, and opening a PR for any kept change or durable finding.
#
# Required secret:
#   CLAUDE_CODE_OAUTH_TOKEN — OAuth token from `claude setup-token`.

on:
  workflow_dispatch:
    inputs:
      focus:
        description: 'Optional focus: card staging, die assignment, apply/end-phase, route-entry, or blank for best current target'
        required: false
        default: ''
      dry_run:
        description: 'Measure/report only; do not commit or open PR'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

concurrency:
  group: combat-ux-tuning-${{ github.ref }}
  cancel-in-progress: false

jobs:
  combat-ux-tuning:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Configure git identity
        run: |
          git config user.name  "axiomancer-combat-ux[bot]"
          git config user.email "41898282+axiomancer-combat-ux[bot]@users.noreply.github.com"

      - name: Provision .env for repo skills
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          DEPLOY_PROVIDER: ${{ secrets.DEPLOY_PROVIDER }}
          FULL_NAME: ${{ secrets.FULL_NAME }}
        run: |
          umask 077
          cat > .env <<EOF
          GH_TOKEN=${GH_TOKEN}
          GH_REPO=${{ github.repository }}
          EAS_PROJECT_ID=${EAS_PROJECT_ID}
          EXPO_TOKEN=${EXPO_TOKEN}
          DEPLOY_PROVIDER=${DEPLOY_PROVIDER}
          FULL_NAME=${FULL_NAME}
          EOF

      - name: Run /combat-ux-tuning
        uses: anthropics/claude-code-base-action@beta
        with:
          prompt: |
            Read `skills/combat-ux-tuning.md` and execute it exactly.

            Invocation arguments:
            - focus: `${{ github.event.inputs.focus }}`
            - dry_run: `${{ github.event.inputs.dry_run }}`

            Hard requirements:
            - Ask no questions.
            - Primary metric is automated input friction.
            - Use VITAE/STANCE for player-facing combat copy; do not allow HEALTH/GUARD regressions.
            - If dry_run is true, measure and report only; do not commit or open a PR.
            - If dry_run is false and a change or durable finding is kept, create a fresh branch, push it, and open a GitHub PR against main.
            - Do not push directly to main.
            - Stop before engine/rules changes, public release/deploy, destructive operations, secrets changes, or major product-direction changes.

            If `focus` is blank, choose the highest-value measurable input-friction target from current repo truth.
          model: claude-sonnet-5
          claude_env: |
            CLAUDE_CODE_EFFORT_LEVEL: high
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_tools: "Bash,Read,Edit,Write,Glob,Grep,TodoWrite,WebFetch,WebSearch"
          settings: '{"permissions":{"defaultMode":"bypassPermissions","skipDangerousModePermissionPrompt":true}}'
          timeout_minutes: '70'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
