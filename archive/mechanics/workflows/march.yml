name: march

# Manually fire the autonomous-beast loop: one tick of `/march`, which
# dispatches to triage / critique / ship-a-phase / expand / iterate.
#
# Trigger: Actions tab → "march" → Run workflow. Pick the branch you want
# the tick to commit against. The skill follows its normal contract — it
# may push commits, open / close GitHub issues, and run the verify gate.
#
# Required secrets (Settings → Secrets and variables → Actions):
#   CLAUDE_CODE_OAUTH_TOKEN — OAuth token from `claude setup-token`,
#                             draws from your Claude Code subscription
#                             instead of per-token API billing.
#
# The workflow uses the auto-provisioned GITHUB_TOKEN for `gh` and git
# operations. No PAT needed unless you want cross-repo behaviour.

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:
    inputs:
      args:
        description: 'Optional argument passed to /march (e.g. "phase 10", "iterate")'
        required: false
        default: ''

permissions:
  contents: write        # git push commits the loop produces
  issues: write          # /triage + phase-mirror issue ops
  pull-requests: write   # /critique / /iterate may open PRs
  actions: read          # idle gate parity with mobile / future run-history checks
  id-token: write        # for Anthropic's auth proxy

concurrency:
  group: march-${{ github.ref }}
  cancel-in-progress: false

jobs:
  march:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Idle check (scheduled runs only)
        if: github.event_name == 'schedule'
        id: idle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Scheduled runs should wake when there is recent repo activity OR
          # explicit queued phase work. Manual workflow_dispatch always runs.
          LOOKBACK="3 hours ago"

          # 1. Bot commits in the lookback window → march is productive.
          BOT=$(git log --oneline --after="$LOOKBACK" \
                --author="axiomancer-march" | wc -l | tr -d ' ')

          # 2. Human commits → new work for march to pick up.
          HUMAN=$(git log --oneline --after="$LOOKBACK" \
                  --invert-grep --author="axiomancer-march" | wc -l | tr -d ' ')

          # 3. Issues created/updated recently → triage work.
          CUTOFF=$(date -u -d "$LOOKBACK" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null \
                || date -u -v-3H +%Y-%m-%dT%H:%M:%SZ)
          ISSUES=$(gh issue list --state open --limit 5 \
                   --search "updated:>=$CUTOFF" \
                   --json number -q 'length' 2>/dev/null || echo "0")

          # 4. Ready phase rows → known queued implementation work.
          # Rows marked [x], [deferred], [skipped], [blocked], or [needs-*]
          # are deliberately not counted as fuel.
          PHASES=$(grep -E '^- \[ \] Phase [0-9]+' plan/steps/01_build_plan.md 2>/dev/null \
                   | grep -Ev '\[(deferred|skipped|blocked|needs-[^]]+)\]' \
                   | wc -l | tr -d ' ')

          echo "bot=$BOT  human=$HUMAN  issues=$ISSUES  ready_phases=$PHASES"

          if [ "$BOT" -gt 0 ] || [ "$HUMAN" -gt 0 ] || [ "$ISSUES" -gt 0 ] || [ "$PHASES" -gt 0 ]; then
            echo "Activity or queued phase work detected — proceeding."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No bot commits, human commits, updated issues, or ready phase rows. March is idle — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.idle.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: steps.idle.outputs.skip != 'true'
        run: npm ci

      - name: Configure git identity
        if: steps.idle.outputs.skip != 'true'
        run: |
          git config user.name  "axiomancer-march[bot]"
          git config user.email "41898282+axiomancer-march[bot]@users.noreply.github.com"

      - name: Provision .env for nexus skills
        if: steps.idle.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The nexus skills read GH_TOKEN / GH_REPO from a local .env via
          # `awk -F=`. Provision a CI-scoped copy so /triage and the phase
          # mirror (scripts/loop-issue.mjs) work out of the box.
          umask 077
          cat > .env <<EOF
          GH_TOKEN=${GH_TOKEN}
          GH_REPO=${{ github.repository }}
          EOF

      - name: Run /march
        if: steps.idle.outputs.skip != 'true'
        uses: anthropics/claude-code-base-action@beta
        with:
          prompt: "/march ${{ github.event.inputs.args }}"
          # Pin the current Sonnet latest family model and medium effort. The action default can
          # drift or retire; the autonomous loop should not depend on it.
          model: claude-sonnet-5
          claude_env: |
            CLAUDE_CODE_EFFORT_LEVEL: medium
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The loop needs to: read everything, edit files, run npm / gh /
          # git, and dispatch sub-agents. Bash is the broadest hammer it
          # leans on — keep the allowlist permissive in CI since the
          # workflow itself is the trust boundary.
          allowed_tools: "Bash,Read,Edit,Write,Glob,Grep,Agent,TodoWrite,WebFetch,WebSearch"
          settings: '{"permissions":{"defaultMode":"bypassPermissions","skipDangerousModePermissionPrompt":true}}'
          timeout_minutes: '60'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
