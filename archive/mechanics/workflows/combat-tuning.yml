name: combat-tuning

# Manually fire one Hazard-Pattern Combat tuning tick: runs /combat-tuning
# against the card-and-dice combat engine, focuses the analysis on a requested
# axis, and delivers the report, suggestions, and any auto-applied numeric
# winners together on one new branch with a PR opened for review. Nothing is
# pushed to `main` automatically.
#
# Trigger: Actions tab → "combat-tuning" → Run workflow. Provide an optional
# focus (e.g. "status-beats-basic margin", "boss threat damage",
# "blind-vs-greedy gap", "befriend mercy viability", "single-card-spam",
# "card-pool-variety").
#
# Required secrets (Settings → Secrets and variables → Actions):
#   CLAUDE_CODE_OAUTH_TOKEN — OAuth token from `claude setup-token`, draws from
#                             your Claude Code subscription instead of per-token
#                             API billing. (Mirrors `march`, `mechanics-tuning`,
#                             and `hazard-tuning`; no ANTHROPIC_API_KEY is used.)
#
# The auto-provisioned GITHUB_TOKEN is used to push the combat tuning branch and
# open the PR. The workflow itself is the trust boundary, so Claude runs with
# permissions bypassed (the equivalent of --dangerously-skip-permissions).
#
# Standing law: Hazard-Pattern Combat is the HP-only card-and-dice fight system.
# Do not tune the traversal Hazard minigame here; that belongs to /hazard-tuning.
#
# Fail together: verified failure beats unverified success. The worker must not
# fabricate PR state, test output, file contents, measurements, or completion to
# satisfy momentum.

on:
  workflow_dispatch:
    inputs:
      focus:
        description: 'Combat tuning focus (e.g. "status-beats-basic margin", "boss threat damage", "befriend mercy viability")'
        required: false
        default: ''

permissions:
  contents: write        # push the report/suggestion/tuning PR branch
  pull-requests: write   # open the suggestions PR
  id-token: write        # for Anthropic's auth proxy

concurrency:
  group: combat-tuning
  cancel-in-progress: false

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name  "axiomancer-combat-tuning[bot]"
          git config user.email "41898282+axiomancer-combat-tuning[bot]@users.noreply.github.com"

      - name: Provision .env for nexus skills
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The nexus skills read GH_TOKEN / GH_REPO from a local .env via
          # `awk -F=`. Provision a CI-scoped copy so delivery
          # (git push + gh pr create) works out of the box.
          umask 077
          cat > .env <<EOF
          GH_TOKEN=${GH_TOKEN}
          GH_REPO=${{ github.repository }}
          EOF

      - name: Run /combat-tuning
        uses: anthropics/claude-code-base-action@beta
        with:
          prompt: '/combat-tuning --focus="${{ github.event.inputs.focus }}"'
          # Pin the current Sonnet latest family model and medium effort. The action default can
          # drift or retire; combat tuning should not depend on it.
          model: claude-sonnet-5
          claude_env: |
            CLAUDE_CODE_EFFORT_LEVEL: medium
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The skill needs to read combat docs/libraries, run npm/combat sim
          # evidence matrices, edit numeric/content values only when warranted,
          # and run git / gh for PR delivery. Keep this permissive in CI because
          # the workflow itself is the trust boundary.
          allowed_tools: "Bash,Read,Edit,Write,Glob,Grep,Agent,TodoWrite,WebFetch,WebSearch"
          settings: '{"permissions":{"defaultMode":"bypassPermissions","skipDangerousModePermissionPrompt":true}}'
          timeout_minutes: '110'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
