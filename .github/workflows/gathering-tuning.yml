name: gathering-tuning

# Gathering minigame (The Gleaning) balance loop: wrath economy, plot
# yields, outcome tiers vs the greed<restraint<skill doctrine; report +
# changes on a new branch + PR (never main).
# See .claude/commands/gathering-tuning.md. Runs against axiomancer-mechanics.
# Scheduled weekly-staggered so at most one tuning loop runs per day;
# adjust or delete the cron to change cadence.

on:
  # schedule trigger disabled 2026-07-08 (Actions minute budget review) —
  # run manually via workflow_dispatch until next billing cycle.
  # schedule:
  #   - cron: "29 3 * * 3"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  id-token: write

concurrency:
  group: gathering-tuning
  cancel-in-progress: false

jobs:
  gathering_tuning:
    uses: ./.github/workflows/_claude-skill.yml
    secrets: inherit
    with:
      prompt: "/gathering-tuning"
      timeout_minutes: 90
