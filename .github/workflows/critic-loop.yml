name: critic-loop

# Visual-polish loop: capture every screen of the expo-web export, review as
# a game critic, fix findings, re-capture, repeat until a clean pass.
# See .claude/commands/critic-loop.md. Runs against axiomancer-mobile and
# drives the expo-web build with Playwright, so this workflow is
# dispatch-only — run it from the Actions tab when you want a pass.

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  id-token: write

concurrency:
  group: critic-loop
  cancel-in-progress: false

jobs:
  critic_loop:
    uses: ./.github/workflows/_claude-skill.yml
    secrets: inherit
    with:
      extra_claude_args: |
        -p
        --dangerously-skip-permissions
      prompt: "/critic-loop"
      timeout_minutes: 120
      install_playwright: true
