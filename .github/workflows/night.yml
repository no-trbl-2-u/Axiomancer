name: night

# The night shift: /digest appends the day's briefing as a stylized HTML
# entry under devlog/ (via `npm run devlog:build`), runs the breadth checks
# too slow for the per-commit path, and files tuning proposals as candidates
# (see skills/digest.md — it names this workflow). Every other day
# (odd days), off the march cadence so the two never queue — halved from
# daily 2026-08 to cut Actions spend.

on:
  schedule:
    - cron: '47 8 1-31/2 * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  id-token: write

concurrency:
  group: nexus-loop
  cancel-in-progress: false

jobs:
  digest:
    uses: ./.github/workflows/_claude-skill.yml
    secrets: inherit
    with:
      extra_claude_args: |
        -p
        --dangerously-skip-permissions
      prompt: '/digest'
      # Longest observed run is ~34 min; 45 caps a wedged agent's burn.
      timeout_minutes: 45
      install_playwright: true
