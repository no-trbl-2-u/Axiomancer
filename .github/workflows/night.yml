name: night

# The night shift: /digest appends the day's briefing as a stylized HTML
# entry under devlog/ (via `npm run devlog:build`), runs the breadth checks
# too slow for the per-commit path, and files tuning proposals as candidates
# (see skills/digest.md — it names this workflow). Daily, off the march
# cadence so the two never queue.

on:
  schedule:
    - cron: '47 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  id-token: write

concurrency:
  group: nexus-loop
  cancel-in-progress: false

jobs:
  digest:
    uses: ./.github/workflows/_claude-skill.yml
    secrets: inherit
    with:
      prompt: '/digest'
      timeout_minutes: 90
