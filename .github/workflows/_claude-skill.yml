name: _claude-skill

# Reusable runner for the Claude-powered automation workflows (the nexus
# loop verbs, the tuning loops, and the playtest loops). Every thin
# per-skill workflow calls this with a slash-command prompt; this file owns
# the shared setup so the action config lives in exactly one place.
#
# What it does, in order:
#   1. Checkout with full history (loop skills count commits / read
#      `git log --since`), using GH_PAT when configured so pushes made by
#      the skill trigger the verify-* workflows (the deploy gate).
#   2. Node 22 + `npm ci` so verify gates and mechanics CLIs run without
#      Claude spending turns on setup.
#   3. Optionally install the Playwright Chromium browser (mobile
#      expo-web playtest loops).
#   4. Materialize `.env` (GH_TOKEN / GH_REPO) — the skills load gh auth
#      from `.env` by design.
#   5. Self-test the nexus enforcement layer (.claude/settings.json is
#      committed and always active: guard hooks + deny walls for
#      force-push / --no-verify / destructive resets). CI runs are
#      unattended (intervention level 3+), so a broken guard must fail
#      the job before Claude starts.
#   6. Probe the remote kb-query MCP endpoint (warning only — a dead KB
#      must not sink an unrelated tick).
#   7. Run anthropics/claude-code-action with the given prompt.
#
# Secrets (via `secrets: inherit` from callers):
#   CLAUDE_CODE_OAUTH_TOKEN  required — Claude subscription OAuth token.
#   GH_PAT                   recommended — classic PAT (repo + workflow
#                            scopes) or fine-grained token (contents,
#                            issues, pull-requests RW; actions read).
#                            Without it the default GITHUB_TOKEN is used
#                            and pushes/PRs made by the skills will NOT
#                            trigger the verify-* workflows — deploy-check
#                            then FAILS CLOSED on any code tick (zero
#                            verify runs for a code diff = exit 1, not a
#                            vacuous pass).
#   KB_MCP_TOKEN             recommended — bearer token for the remote
#                            kb-query MCP server. Without it the kb_* tools
#                            are granted but answer 401, and prior-art
#                            grounding degrades to model memory.
#   NOTIFY_NTFY_TOPIC        optional — scripts/notify.mjs pager channel.
#   NOTIFY_WEBHOOK_URL       optional — scripts/notify.mjs webhook channel.

on:
  workflow_call:
    inputs:
      prompt:
        description: 'Prompt passed to Claude (usually a repo slash command, e.g. "/march")'
        required: true
        type: string
      timeout_minutes:
        description: 'Job timeout'
        type: number
        default: 60
      install_playwright:
        description: 'Install Playwright Chromium (mobile expo-web loops) and grant the mcp__playwright__browser_* tools that the playtester/critic sub-agents need to drive it'
        type: boolean
        default: false
      extra_claude_args:
        description: 'Extra Claude Code CLI args appended to the defaults'
        type: string
        default: ''
      model:
        description: 'Model for the run. Default Sonnet 5; scheduled/high-frequency callers should stay on the default — premium tiers are for deliberate, manually dispatched passes.'
        type: string
        default: 'claude-sonnet-5'
      effort:
        description: 'Reasoning effort for models that support it (low|medium|high|xhigh|max). Empty = model default.'
        type: string
        default: ''

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
      GH_REPO: ${{ github.repository }}
      NOTIFY_NTFY_TOPIC: ${{ secrets.NOTIFY_NTFY_TOPIC }}
      NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      - name: Install Playwright Chromium
        if: ${{ inputs.install_playwright }}
        run: npx playwright install chromium --with-deps
        working-directory: axiomancer-mobile

      - name: Materialize .env for the skills
        run: printf 'GH_TOKEN=%s\nGH_REPO=%s\n' "$GH_TOKEN" "$GH_REPO" > .env

      - name: Self-test nexus enforcement layer (guard hooks + deny walls)
        run: node .claude/hooks/guard.mjs self-test

      # MCP grants in CI (phase 72, 2026-08-27):
      #
      #   axio-query  — GRANTED below. Its server is `scripts/axio-mcp-server.mjs`,
      #                 in the repo, so it starts wherever the checkout does. Without
      #                 it, card-expert's engine-truth grounding degrades to file
      #                 reads on every unattended run (content-pipelines audit §6.4).
      #   kb-query    — GRANTED below (2026-08-31). Its server is now a remote
      #                 HTTP endpoint the KB repo deploys, so the old blocker (the
      #                 stdio script lived under gitignored `kb/` and could not
      #                 exist in a CI checkout) is void: no sync step, no per-run
      #                 download. Auth is a bearer token out of the environment —
      #                 `.mcp.json` references ${KB_MCP_TOKEN} and Claude Code
      #                 expands it from the process env, NOT from the .env written
      #                 above, which is why the secret is set as step env below.
      #                 Cloud ticks previously cited prior art from model memory;
      #                 they can now cite kb:<game>/<doc> (src-NNN) receipts.
      # Warning, never fatal: an unreachable KB degrades prior-art grounding
      # but has nothing to do with whether this tick's actual work can run.
      # Fail-closed on a 401 here would sink every loop on a token rotation.
      - name: Probe the kb-query MCP endpoint
        continue-on-error: true
        env:
          KB_MCP_TOKEN: ${{ secrets.KB_MCP_TOKEN }}
        run: |
          health=$(curl -sS -m 15 https://kb-mcp.no-trbl-2-u.workers.dev/health || echo '{}')
          echo "kb-query /health: $health"
          if [ -z "$KB_MCP_TOKEN" ]; then
            echo "::warning::KB_MCP_TOKEN is unset — kb_* tools are granted but will answer 401. Prior art degrades to model memory."
            exit 0
          fi
          code=$(curl -sS -m 20 -o /dev/null -w '%{http_code}'             https://kb-mcp.no-trbl-2-u.workers.dev/mcp             -H "Authorization: Bearer $KB_MCP_TOKEN"             -H 'Content-Type: application/json'             -H 'Accept: application/json, text/event-stream'             -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' || echo 000)
          if [ "$code" = "200" ]; then
            echo "kb-query tools/list: 200 — prior-art grounding available"
          else
            echo "::warning::kb-query tools/list returned $code (401 = bad/rotated token, 503 = Worker secret missing). Tools are granted but unusable this run."
          fi

      - name: Run Claude Code
        id: claude
        env:
          KB_MCP_TOKEN: ${{ secrets.KB_MCP_TOKEN }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GH_PAT || github.token }}
          prompt: ${{ inputs.prompt }}
          show_full_output: true
          claude_args: |
            --model ${{ inputs.model }}
            ${{ inputs.effort != '' && format('--effort {0}', inputs.effort) || '' }}
            --allowedTools "Bash,Edit,Write,Read,Glob,Grep,Task,TodoWrite,WebFetch,WebSearch,mcp__axio-query__axio_overview,mcp__axio-query__axio_cards,mcp__axio-query__axio_effects,mcp__axio-query__axio_keywords,mcp__kb-query__kb_overview,mcp__kb-query__kb_find_games,mcp__kb-query__kb_search,mcp__kb-query__kb_read_doc,mcp__kb-query__kb_cards,mcp__kb-query__kb_keyword${{ inputs.install_playwright && ',mcp__playwright__browser_navigate,mcp__playwright__browser_click,mcp__playwright__browser_snapshot,mcp__playwright__browser_take_screenshot,mcp__playwright__browser_console_messages,mcp__playwright__browser_close,mcp__playwright__browser_resize,mcp__playwright__browser_press_key,mcp__playwright__browser_hover,mcp__playwright__browser_evaluate,mcp__playwright__browser_wait_for,mcp__playwright__browser_tabs,mcp__playwright__browser_network_requests,mcp__playwright__browser_navigate_back' || '' }}"
            ${{ inputs.extra_claude_args }}

      - name: Fail if Claude reported an execution error
        if: ${{ always() && steps.claude.outputs.execution_file != '' }}
        shell: bash
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = process.env.CLAUDE_EXECUTION_FILE;
          const raw = fs.readFileSync(path, 'utf8');
          const data = JSON.parse(raw);
          const events = Array.isArray(data) ? data : [data];
          const failing = events.find((event) => event && event.is_error === true);
          if (failing) {
            const status = failing.api_error_status || failing.error_status || 'unknown';
            const error = failing.error || 'unknown_error';
            const result = typeof failing.result === 'string' ? failing.result : JSON.stringify(failing.result || {});
            console.error(`Claude execution failed: status=${status} error=${error}`);
            console.error(result);
            process.exit(1);
          }
          NODE
