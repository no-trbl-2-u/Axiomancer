name: hazard-tuning

# Hazard minigame balance loop: card ratios, thresholds, mana economy vs
# CDR-0006 targets; report + numeric changes on a new branch + PR (never
# main).
# See .claude/commands/hazard-tuning.md. Runs against axiomancer-mechanics.
# Scheduled weekly-staggered so at most one tuning loop runs per day;
# adjust or delete the cron to change cadence.

on:
  # schedule trigger disabled 2026-07-08 (Actions minute budget review) —
  # run manually via workflow_dispatch until next billing cycle.
  # schedule:
  #   - cron: "29 3 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  id-token: write

concurrency:
  group: hazard-tuning
  cancel-in-progress: false

jobs:
  hazard_tuning:
    uses: ./.github/workflows/_claude-skill.yml
    secrets: inherit
    with:
      extra_claude_args: |
        -p
        --dangerously-skip-permissions
      prompt: "/hazard-tuning"
      timeout_minutes: 90
