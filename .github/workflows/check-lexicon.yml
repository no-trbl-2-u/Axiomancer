name: check-lexicon

# Active package verification runs the lexicon check in its already-billed
# runner. Documentation-only commits are guarded by the tracked pre-commit hook;
# this weekly/manual sweep is the remote backstop for commits made without the
# hook. It no longer launches one extra hosted runner for every code commit.

on:
  schedule:
    - cron: '19 7 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-lexicon
  cancel-in-progress: true

jobs:
  check-lexicon:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Lint retired terminology
        run: node scripts/check-lexicon.mjs
      - name: Lint unit tests (identifier + doctrine row shapes)
        run: node --test scripts/check-lexicon.test.mjs
