name: check-lexicon

# Retired-terminology lint (scripts/check-lexicon.mjs — plain node, no AI,
# no npm ci needed). Enforces axiomancer-mechanics/docs/lexicon.json against
# every live *.md surface so retired game concepts (src/Skills, basePower,
# chipHp, Pressure Tracks, ...) cannot quietly re-enter docs that agents
# read as current law. See docs/LEXICON.md for the triage rules (fix vs
# HISTORICAL banner vs lexicon-ok pragma).

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'axiomancer-mechanics/docs/lexicon.json'
      - 'scripts/check-lexicon.mjs'
      - '.github/workflows/check-lexicon.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'
      - 'axiomancer-mechanics/docs/lexicon.json'
      - 'scripts/check-lexicon.mjs'
      - '.github/workflows/check-lexicon.yml'

permissions:
  contents: read

concurrency:
  group: check-lexicon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-lexicon:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lint retired terminology
        run: node scripts/check-lexicon.mjs
