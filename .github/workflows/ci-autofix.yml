name: ci-autofix

# Red-main first responder: when a verify-* workflow fails on main,
# /fix-ci reads the failed run's logs, reproduces locally, fixes the root
# cause, and pushes the fix to main (see skills/fix-ci.md).
# Note: this only fires for pushes that triggered verify-* in the first
# place — loop pushes made with the default GITHUB_TOKEN don't trigger
# workflows, which is why the GH_PAT secret is recommended.

on:
  workflow_run:
    workflows: [verify-mechanics, verify-mobile, verify-card-editor]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  id-token: write

# Concurrency lives on the job, not the workflow, and in its own group
# (R0, 2026-09-28). Every verify-* completion starts a run of this workflow,
# green ones included. With a workflow-level group those runs queued in the
# shared nexus-loop group before the `if` skipped them, and GitHub keeps
# only the newest pending run per group, so a skipped run displaced the
# pending real one: 2 succeeded, 32 were cancelled while still queued (zero
# jobs each), 266 were skipped. A job-level group is entered only after the
# `if` passes, so only a real red-main run can queue.

jobs:
  fix:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_branch == 'main')
    concurrency:
      group: ci-autofix
      cancel-in-progress: false
    uses: ./.github/workflows/_claude-skill.yml
    secrets: inherit
    with:
      extra_claude_args: |
        -p
        --dangerously-skip-permissions
      prompt: '/fix-ci ${{ github.event.workflow_run.id }}'
      timeout_minutes: 60
