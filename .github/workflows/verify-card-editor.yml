name: verify-card-editor

# Card-editor-owned verification. Mechanics and root lockfile changes are owned
# by verify-mechanics, which runs the editor contract check when its coupled
# mechanics paths change. This workflow therefore starts only for editor work.

on:
  push:
    branches: [main]
    paths:
      - 'axiomancer-card-editor/**'
      - '.github/workflows/verify-card-editor.yml'
  pull_request:
    branches: [main]
    paths:
      - 'axiomancer-card-editor/**'
      - '.github/workflows/verify-card-editor.yml'

permissions:
  contents: read

concurrency:
  group: verify-card-editor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      - name: Check retired terminology
        run: node scripts/check-lexicon.mjs

      - name: Verify editor (type-check + lint + build)
        run: npm run verify --workspace axiomancer-card-editor
