name: transfer-board-brainstorm-secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SOURCE_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      SOURCE_EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      SOURCE_GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - name: Copy repository secrets without exposing values
        shell: bash
        run: |
          set -euo pipefail
          target="no-trbl-2-u/board-brainstorm"

          [ -n "$SOURCE_CLAUDE_CODE_OAUTH_TOKEN" ]
          [ -n "$SOURCE_EXPO_TOKEN" ]
          [ -n "$SOURCE_GH_PAT" ]

          export GH_TOKEN="$SOURCE_GH_PAT"
          gh repo view "$target" >/dev/null

          printf '%s' "$SOURCE_CLAUDE_CODE_OAUTH_TOKEN" | gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo "$target"
          printf '%s' "$SOURCE_EXPO_TOKEN" | gh secret set EXPO_TOKEN --repo "$target"
          printf '%s' "$SOURCE_GH_PAT" | gh secret set GH_PAT --repo "$target"

          actual="$(gh secret list --repo "$target" --app actions --json name --jq '.[].name' | sort)"
          expected="$(printf '%s\n' CLAUDE_CODE_OAUTH_TOKEN EXPO_TOKEN GH_PAT | sort)"
          [ "$actual" = "$expected" ]
          echo "Transferred and verified 3 Actions secret names in $target."
