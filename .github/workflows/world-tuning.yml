name: world-tuning

# World map/event balance loop: MapEvent spread, hazard/rest payloads,
# encounter difficulty scaling per map; report + changes on a new branch +
# PR (never main).
# See .claude/commands/world-tuning.md. Runs against axiomancer-mechanics.
# Scheduled weekly-staggered so at most one tuning loop runs per day;
# adjust or delete the cron to change cadence.

on:
  # schedule trigger disabled 2026-07-08 (Actions minute budget review) —
  # run manually via workflow_dispatch until next billing cycle.
  # schedule:
  #   - cron: "29 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  id-token: write

concurrency:
  group: world-tuning
  cancel-in-progress: false

jobs:
  world_tuning:
    uses: ./.github/workflows/_claude-skill.yml
    secrets: inherit
    with:
      extra_claude_args: |
        -p
        --dangerously-skip-permissions
      prompt: "/world-tuning"
      timeout_minutes: 90
