name: verify-mobile

# Mobile-owned verification. Mechanics and root lockfile changes are owned by
# verify-mechanics, which runs the affected consumer gates itself; this avoids
# launching a second full mobile workflow for the same commit.
#
# This job deliberately preserves the existing full mobile evidence on every
# mobile change. It installs once, verifies once, exports once, then reuses that
# inspected export for every Playwright journey. Subsystem path-routing is a
# separate policy decision and is not enabled here.

on:
  push:
    branches: [main]
    paths:
      - 'axiomancer-mobile/**'
      - '.github/workflows/verify-mobile.yml'
  pull_request:
    branches: [main]
    paths:
      - 'axiomancer-mobile/**'
      - '.github/workflows/verify-mobile.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: verify-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify + bundler + Playwright journeys
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      - name: Check retired terminology
        run: node scripts/check-lexicon.mjs

      - name: Run mobile verify gate
        run: npm run verify --workspace axiomancer-mobile

      - name: Export and inspect the web bundle once
        run: npm run smoke:bundler --workspace axiomancer-mobile
        env:
          BUILD_PROFILE: preview
          SMOKE_BUNDLER_TIMEOUT_MS: '480000'
          SMOKE_BUNDLER_OUTPUT_DIR: '.smoke-dist'

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Hazard playthrough (both routes)
        run: npm run e2e:hazard --workspace axiomancer-mobile
        env:
          HAZARD_E2E_REUSE_EXPORT: '1'

      - name: Gathering playthrough (both stances)
        run: npm run e2e:gathering --workspace axiomancer-mobile
        env:
          GATHER_E2E_REUSE_EXPORT: '1'

      - name: Encounter routing (every minigame trigger to its screen)
        run: npm run e2e:encounters --workspace axiomancer-mobile
        env:
          ENCOUNTER_E2E_REUSE_EXPORT: '1'

      - name: Combat playthrough (Hazard-Pattern Combat)
        run: npm run e2e:combat --workspace axiomancer-mobile
        env:
          COMBAT_E2E_REUSE_EXPORT: '1'
