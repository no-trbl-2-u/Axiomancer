name: triage

# Manual issue triage: /triage classifies an issue, applies a triage:*
# label, comments, and routes it to the right backlog (see
# skills/triage.md). /march runs triage as its first gate, so new issues
# are picked up on the next tick; the per-issue `issues:` trigger was
# removed 2026-08 to cut Actions spend (~500 min per half-month) — the
# march gate makes it redundant. Dispatch this manually for an immediate
# pass on a specific issue.

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to triage (blank = sweep unlabeled)'
        required: false
        default: ''

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  id-token: write

concurrency:
  group: nexus-loop
  cancel-in-progress: false

jobs:
  triage:
    uses: ./.github/workflows/_claude-skill.yml
    secrets: inherit
    with:
      extra_claude_args: |
        -p
        --dangerously-skip-permissions
      prompt: '/triage ${{ github.event.inputs.issue_number }}'
      timeout_minutes: 30
