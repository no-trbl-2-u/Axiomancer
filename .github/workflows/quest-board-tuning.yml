name: quest-board-tuning

# Quest Board minigame (The Boy's Almanac) balance loop: session length,
# part economy, vigor pressure vs the deliberate-finishes-well doctrine;
# report + changes on a new branch + PR (never main).
# See .claude/commands/quest-board-tuning.md. Runs against axiomancer-mechanics.
# Scheduled weekly-staggered so at most one tuning loop runs per day;
# adjust or delete the cron to change cadence.

on:
  schedule:
    - cron: "29 3 * * 6"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  id-token: write

concurrency:
  group: quest-board-tuning
  cancel-in-progress: false

jobs:
  quest_board_tuning:
    uses: ./.github/workflows/_claude-skill.yml
    secrets: inherit
    with:
      prompt: "/quest-board-tuning"
      timeout_minutes: 90
