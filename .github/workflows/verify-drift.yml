name: verify-drift

# The content-drift gate (phase 68). The tables it compares live in three
# different workspaces, so no single package's verify job can own it: an
# editor-only or catalog-only edit would not trigger verify-mobile, and a
# mobile-only edit would not trigger the editor's. This lane triggers on every
# path the test reads, which is the whole point of hosting it at the root.
#
# It has since become the harness lane too: the grant-consistency check and the
# kb-query launcher live here for the same reason — they span `.mcp.json`,
# `.claude/`, and `scripts/`, so no workspace verify job would catch them.

on:
  push:
    branches: [main]
    paths:
      - 'axiomancer-mobile/components/combat/glyphShapes.ts'
      - 'axiomancer-mobile/state/combat/keywords.ts'
      - 'axiomancer-card-editor/src/components/CardFace.tsx'
      - 'axiomancer-card-editor/src/theme/wx.ts'
      - 'axiomancer-mechanics/docs/keyword-atlas.md'
      - 'scripts/build-catalog.mjs'
      - 'scripts/content-drift.mjs'
      - 'scripts/content-drift.test.mjs'
      - '.claude/settings.json'
      - '.claude/agents/**'
      - '.mcp.json'
      - 'scripts/check-harness-grants.mjs'
      - 'scripts/kb-query-launcher.mjs'
      - 'scripts/kb-query-launcher.test.mjs'
      - '.github/workflows/verify-drift.yml'
  pull_request:
    branches: [main]
    paths:
      - 'axiomancer-mobile/components/combat/glyphShapes.ts'
      - 'axiomancer-mobile/state/combat/keywords.ts'
      - 'axiomancer-card-editor/src/components/CardFace.tsx'
      - 'axiomancer-card-editor/src/theme/wx.ts'
      - 'axiomancer-mechanics/docs/keyword-atlas.md'
      - 'scripts/build-catalog.mjs'
      - 'scripts/content-drift.mjs'
      - 'scripts/content-drift.test.mjs'
      - '.claude/settings.json'
      - '.claude/agents/**'
      - '.mcp.json'
      - 'scripts/check-harness-grants.mjs'
      - 'scripts/kb-query-launcher.mjs'
      - 'scripts/kb-query-launcher.test.mjs'
      - '.github/workflows/verify-drift.yml'
  schedule:
    - cron: '41 7 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-drift-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Content-drift gate
        run: node --test scripts/content-drift.test.mjs
      - name: Harness grant consistency
        run: node scripts/check-harness-grants.mjs

      # The kb-query entrypoint every grant above points at. Hermetic: it
      # drives the launcher against local stubs and never touches the hosted
      # Worker, so it needs no token and no network.
      - name: kb-query launcher
        run: node --test scripts/kb-query-launcher.test.mjs
