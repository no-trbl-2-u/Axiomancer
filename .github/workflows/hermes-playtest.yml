name: hermes-playtest

# Hermes-native UI playthrough.
# See .claude/commands/hermes-playtest.md. Runs against axiomancer-mobile and
# drives the expo-web build with Playwright, so this workflow is
# dispatch-only — run it from the Actions tab when you want a pass.

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  id-token: write

concurrency:
  group: hermes-playtest
  cancel-in-progress: false

jobs:
  hermes_playtest:
    uses: ./.github/workflows/_claude-skill.yml
    secrets: inherit
    with:
      extra_claude_args: |
        -p
        --dangerously-skip-permissions
      prompt: "/hermes-playtest"
      timeout_minutes: 120
      install_playwright: true
