name: claude-pr-review

# Automatic first-pass review on every non-draft PR. The tuning and
# playtest loops deliver their changes as PRs by design ("nothing
# auto-lands on main") — this gives each one a reviewer without waiting
# for a human pass. Read-only: it comments, it never pushes fixes.

on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: write
  actions: read
  id-token: write

concurrency:
  group: claude-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude review
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GH_PAT || github.token }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            Context: read AGENTS.md first. Check in particular:
            - Correctness bugs in the diff (not style nits).
            - The cross-package impact checklist in AGENTS.md: if the diff
              touches the listed axiomancer-mechanics paths, confirm the PR
              ran (or CI runs) the mobile verify and card-editor type-check
              legs.
            - For tuning-loop PRs: numbers changed should match the evidence
              tables in the attached report; flag changes with no evidence.
            - Tests alongside code (repo rule), no Co-Authored-By trailers,
              no emojis (repo rule).

            Leave inline comments for specific findings and one summary
            comment with a clear verdict (looks good / needs changes).
            Be brief; do not restate the diff.
          claude_args: |
            --allowedTools "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),mcp__github_inline_comment__create_inline_comment"
