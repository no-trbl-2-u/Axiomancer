name: march

# The autonomous-beast tick: /march dispatches triage → critique →
# ship-a-phase → iterate and executes one tick end-to-end (see
# skills/march.md). Scheduled every 6 hours (throttled from hourly to cut
# Actions minutes — see 2026-07-08 usage review); adjust or delete the
# cron to retune, or run it by hand from the Actions tab. Ticks share
# the nexus-loop concurrency group, so a long tick makes the next one
# queue (and GitHub keeps only the newest queued run) — the loop
# self-throttles instead of stacking.

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      focus_phase:
        description: 'Optional phase number/id for this manual run (for example: 22). Empty runs normal /march dispatch.'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  id-token: write

concurrency:
  group: nexus-loop
  cancel-in-progress: false

jobs:
  march:
    uses: ./.github/workflows/_claude-skill.yml
    secrets: inherit
    with:
      prompt: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.focus_phase != '' && format('/ship-a-phase phase {0}', github.event.inputs.focus_phase) || '/march' }}
      timeout_minutes: 90
