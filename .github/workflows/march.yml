name: march

# The autonomous-beast tick: /march dispatches triage → critique →
# ship-a-phase → iterate and executes one tick end-to-end (see
# skills/march.md). Scheduled every 6 hours (throttled from hourly to cut
# Actions minutes — see 2026-07-08 usage review); adjust or delete the
# cron to retune, or run it by hand from the Actions tab. Ticks share
# the nexus-loop concurrency group, so a long tick makes the next one
# queue (and GitHub keeps only the newest queued run) — the loop
# self-throttles instead of stacking.

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      focus_phase:
        description: 'Optional phase number/id for this manual run (for example: 22). Empty runs normal /march dispatch.'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  id-token: write

concurrency:
  group: nexus-loop
  cancel-in-progress: false

jobs:
  march:
    uses: ./.github/workflows/_claude-skill.yml
    secrets: inherit
    with:
      extra_claude_args: |
        -p
        --dangerously-skip-permissions
      prompt: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.focus_phase != '' && format('/ship-a-phase phase {0}', github.event.inputs.focus_phase) || '/march' }}
      # Typical tick is ~23 min; at least one wedged run burned the full
      # 90-min budget (2026-08 usage review). 75 keeps headroom for a big
      # ship-a-phase tick while capping runaway burn.
      timeout_minutes: 75
      # /march can dispatch into /critique (rate-limited: ≥12 commits +
      # ≥24h, green deploy), which drives the local expo-web build with the
      # playtester sub-agent over Playwright. Without this the browser tools
      # are not granted, the playtester is denied `browser_navigate`, and the
      # critique tick no-ops (empty findings, no commit) while reporting
      # success — and since it never advances CRITIQUE.md's last-pass marker,
      # every following tick re-dispatches to the same dead end and starves
      # pending phases. Grant Playwright so a march-dispatched critique runs.
      install_playwright: true
