name: march

# The autonomous-beast tick: /march dispatches triage → critique →
# ship-a-phase → iterate and executes one tick end-to-end (see
# skills/march.md). Scheduled every 6 hours; adjust or delete the cron to
# throttle the loop, or run it by hand from the Actions tab.

on:
  schedule:
    - cron: '23 1,7,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  id-token: write

concurrency:
  group: nexus-loop
  cancel-in-progress: false

jobs:
  march:
    uses: ./.github/workflows/_claude-skill.yml
    secrets: inherit
    with:
      prompt: '/march'
      timeout_minutes: 90
