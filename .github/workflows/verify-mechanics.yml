name: verify-mechanics

# Sole owner for mechanics and root dependency changes. Mobile and the card
# editor consume mechanics as local source, so this job detects the documented
# cross-package impact paths and runs the affected consumer gates in the same
# installed environment. Unknown, lockfile, and workflow changes fail closed.
#
# Cards-library data-only edits retain their former carve-out: mechanics,
# mobile unit/type checks, editor contract checks, and the real Expo export all
# run, while the slow browser journeys are skipped.

on:
  push:
    branches: [main]
    paths:
      - 'axiomancer-mechanics/**'
      - '.github/workflows/verify-mechanics.yml'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - 'axiomancer-mechanics/**'
      - '.github/workflows/verify-mechanics.yml'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: verify-mechanics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: mechanics + affected consumers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout full history for impact detection
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install workspace dependencies once
        run: npm ci

      - name: Determine cross-package impact
        id: impact
        shell: bash
        run: |
          set -euo pipefail

          force_full=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=200 origin "${{ github.base_ref }}" 2>/dev/null \
              || git fetch --no-tags origin "${{ github.base_ref }}" 2>/dev/null || true
            base="$(git merge-base "origin/${{ github.base_ref }}" HEAD 2>/dev/null || true)"
            if [ -n "$base" ]; then
              range="$base...HEAD"
            else
              range="HEAD~1..HEAD"
              force_full=true
            fi
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="HEAD~1..HEAD"
            force_full=true
          fi

          changed="$(git diff --name-only "$range")"
          printf 'diff range: %s\nchanged files:\n%s\n' "$range" "$changed"

          mobile_paths=(
            'axiomancer-mechanics/src/Combat/'
            'axiomancer-mechanics/src/Cards/'
            'axiomancer-mechanics/src/Effects/'
            'axiomancer-mechanics/src/index.ts'
            'axiomancer-mechanics/src/World/LootCache/'
            'axiomancer-mechanics/src/World/Gathering/'
            'axiomancer-mechanics/src/World/Hazard/'
            'axiomancer-mechanics/src/World/Rest/'
            'axiomancer-mechanics/src/World/QuestBoard/'
          )
          editor_paths=(
            'axiomancer-mechanics/src/Cards/'
            'axiomancer-mechanics/src/Effects/'
            'axiomancer-mechanics/src/Combat/'
            'axiomancer-mechanics/src/index.ts'
          )

          mobile=false
          editor=false
          run_heavy=false
          card_only=false

          if git diff --name-only "$range" -- "${mobile_paths[@]}" | grep -q .; then
            mobile=true
          fi
          if git diff --name-only "$range" -- "${editor_paths[@]}" | grep -q .; then
            editor=true
          fi

          trigger_changed="$(printf '%s\n' "$changed" | grep -E '^(axiomancer-mechanics/|package-lock\.json$|\.github/workflows/verify-mechanics\.yml$)' || true)"
          if [ -n "$trigger_changed" ] \
            && ! printf '%s\n' "$trigger_changed" | grep -Fvx 'axiomancer-mechanics/src/Cards/cards.library.ts' >/dev/null; then
            card_only=true
          fi

          if [ "$force_full" = true ] \
            || printf '%s\n' "$changed" | grep -Eq '^(package-lock\.json|\.github/workflows/verify-mechanics\.yml)$'; then
            mobile=true
            editor=true
            run_heavy=true
          elif [ "$mobile" = true ] && [ "$card_only" != true ]; then
            run_heavy=true
          fi

          echo "mobile=$mobile" >> "$GITHUB_OUTPUT"
          echo "editor=$editor" >> "$GITHUB_OUTPUT"
          echo "run_heavy=$run_heavy" >> "$GITHUB_OUTPUT"
          echo "card_only=$card_only" >> "$GITHUB_OUTPUT"
          printf 'mobile=%s editor=%s run_heavy=%s card_only=%s\n' \
            "$mobile" "$editor" "$run_heavy" "$card_only"

      - name: Baseline freshness (soft warning)
        run: node scripts/check-baseline-freshness.mjs

      - name: Check retired terminology
        run: node scripts/check-lexicon.mjs

      - name: Skip-comment gate
        run: node automation/check-skip-comments.mjs
        working-directory: axiomancer-mechanics

      - name: Verify mechanics (type-check + tests + build)
        run: npm run verify --workspace axiomancer-mechanics

      - name: Verify mobile against affected mechanics
        if: steps.impact.outputs.mobile == 'true'
        run: npm run verify --workspace axiomancer-mobile

      - name: Type-check card editor against affected mechanics
        if: steps.impact.outputs.editor == 'true'
        run: npm run type-check --workspace axiomancer-card-editor

      - name: Export and inspect the affected mobile bundle once
        if: steps.impact.outputs.mobile == 'true'
        run: npm run smoke:bundler --workspace axiomancer-mobile
        env:
          BUILD_PROFILE: preview
          SMOKE_BUNDLER_TIMEOUT_MS: '480000'
          SMOKE_BUNDLER_OUTPUT_DIR: '.smoke-dist'

      - name: Install Playwright Chromium
        if: steps.impact.outputs.run_heavy == 'true'
        run: npx playwright install --with-deps chromium

      - name: Hazard playthrough (both routes)
        if: steps.impact.outputs.run_heavy == 'true'
        run: npm run e2e:hazard --workspace axiomancer-mobile
        env:
          HAZARD_E2E_REUSE_EXPORT: '1'

      - name: Gathering playthrough (both stances)
        if: steps.impact.outputs.run_heavy == 'true'
        run: npm run e2e:gathering --workspace axiomancer-mobile
        env:
          GATHER_E2E_REUSE_EXPORT: '1'

      - name: Encounter routing (every minigame trigger to its screen)
        if: steps.impact.outputs.run_heavy == 'true'
        run: npm run e2e:encounters --workspace axiomancer-mobile
        env:
          ENCOUNTER_E2E_REUSE_EXPORT: '1'

      - name: Combat playthrough (Hazard-Pattern Combat)
        if: steps.impact.outputs.run_heavy == 'true'
        run: npm run e2e:combat --workspace axiomancer-mobile
        env:
          COMBAT_E2E_REUSE_EXPORT: '1'
