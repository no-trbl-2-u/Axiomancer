name: verify-mechanics

# Verify gate for the mechanics engine. Runs the package's own `verify`
# script (type-check + type-check:tests + lint + vitest + build) on every
# PR/push to main that touches the mechanics package.
#
# No publish / deploy:check step — the monorepo consumes mechanics as local
# source (mobile + card-editor via the @mechanics alias); it is no longer
# published to npm, so the old dist/tag/CHANGELOG structural assertions do
# not apply.

on:
  push:
    branches: [main]
    paths:
      - 'axiomancer-mechanics/**'
      - '.github/workflows/verify-mechanics.yml'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - 'axiomancer-mechanics/**'
      - '.github/workflows/verify-mechanics.yml'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: verify-mechanics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      - name: Skip-comment gate
        run: node automation/check-skip-comments.mjs
        working-directory: axiomancer-mechanics

      - name: Verify (type-check + tests + build)
        run: npm run verify --workspace axiomancer-mechanics
