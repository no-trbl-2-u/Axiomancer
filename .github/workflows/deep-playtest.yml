name: deep-playtest

# First-time-player playthrough via the playtester agent; documents UX
# friction, flow gaps, and delight moments to
# axiomancer-mobile/docs/reports/PLAYTEST_REPORT.md.
# See .claude/commands/deep-playtest.md. Runs against axiomancer-mobile and
# drives the expo-web build with Playwright, so this workflow is
# dispatch-only — run it from the Actions tab when you want a pass.

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  id-token: write

concurrency:
  group: deep-playtest
  cancel-in-progress: false

jobs:
  deep_playtest:
    uses: ./.github/workflows/_claude-skill.yml
    secrets: inherit
    with:
      prompt: "/deep-playtest"
      timeout_minutes: 120
      install_playwright: true
