name: combat-ux-tuning

# Automated combat UX A/B tuner against the expo-web build.
# See .claude/commands/combat-ux-tuning.md. Runs against axiomancer-mobile and
# drives the expo-web build with Playwright, so this workflow is
# dispatch-only — run it from the Actions tab when you want a pass.

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  id-token: write

concurrency:
  group: combat-ux-tuning
  cancel-in-progress: false

jobs:
  combat_ux_tuning:
    uses: ./.github/workflows/_claude-skill.yml
    secrets: inherit
    with:
      extra_claude_args: |
        -p
        --dangerously-skip-permissions
      prompt: "/combat-ux-tuning"
      timeout_minutes: 120
      install_playwright: true
