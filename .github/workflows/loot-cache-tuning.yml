name: loot-cache-tuning

# Loot-cache encounter (The Reliquary) balance loop: Pick Pool odds, jam
# bite, layer payouts vs the informed>blind>coward doctrine; report +
# changes on a new branch + PR (never main).
# See .claude/commands/loot-cache-tuning.md. Runs against axiomancer-mechanics.
# Scheduled weekly-staggered so at most one tuning loop runs per day;
# adjust or delete the cron to change cadence.

on:
  # schedule trigger disabled 2026-07-08 (Actions minute budget review) —
  # run manually via workflow_dispatch until next billing cycle.
  # schedule:
  #   - cron: "29 3 * * 5"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  id-token: write

concurrency:
  group: loot-cache-tuning
  cancel-in-progress: false

jobs:
  loot_cache_tuning:
    uses: ./.github/workflows/_claude-skill.yml
    secrets: inherit
    with:
      extra_claude_args: |
        -p
        --dangerously-skip-permissions
      prompt: "/loot-cache-tuning"
      timeout_minutes: 90
