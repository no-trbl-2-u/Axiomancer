name: dep-upgrades

# Weekly dependency hygiene: patch/minor bumps only, guarded by the full
# root verify gate, delivered as one PR (see
# .claude/commands/dep-upgrades.md). The locked stack (React pin, Expo
# SDK) is never touched; available majors are listed in the PR body for
# a human decision.

on:
  # schedule trigger disabled 2026-07-08 (Actions minute budget review) —
  # run manually via workflow_dispatch until next billing cycle.
  # schedule:
  #   - cron: '13 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  id-token: write

concurrency:
  group: dep-upgrades
  cancel-in-progress: false

jobs:
  deps:
    uses: ./.github/workflows/_claude-skill.yml
    secrets: inherit
    with:
      extra_claude_args: |
        -p
        --dangerously-skip-permissions
      prompt: '/dep-upgrades'
      timeout_minutes: 90
