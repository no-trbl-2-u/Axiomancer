name: rest-tuning

# Rest encounter (The Night Watch) balance loop: posture gradient, warmth
# economy, dawn tiers vs the meagre-but-never-lethal doctrine; report +
# changes on a new branch + PR (never main).
# See .claude/commands/rest-tuning.md. Runs against axiomancer-mechanics.
# Scheduled weekly-staggered so at most one tuning loop runs per day;
# adjust or delete the cron to change cadence.

on:
  # schedule trigger disabled 2026-07-08 (Actions minute budget review) —
  # run manually via workflow_dispatch until next billing cycle.
  # schedule:
  #   - cron: "29 3 * * 4"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  id-token: write

concurrency:
  group: rest-tuning
  cancel-in-progress: false

jobs:
  rest_tuning:
    uses: ./.github/workflows/_claude-skill.yml
    secrets: inherit
    with:
      prompt: "/rest-tuning"
      timeout_minutes: 90
