name: deck-tuning

# Card Forge balance loop: card/deck tuning through the
# playtest matrix; report + changes land on a new branch + PR (never main).
# See .claude/commands/deck-tuning.md. Runs against axiomancer-mechanics.
# Scheduled weekly-staggered so at most one tuning loop runs per day;
# adjust or delete the cron to change cadence.

on:
  # schedule trigger disabled 2026-07-08 (Actions minute budget review) —
  # run manually via workflow_dispatch until next billing cycle.
  # schedule:
  #   - cron: "29 3 * * 1"
  workflow_dispatch:
    inputs:
      preset:
        description: 'Preset to tune (all = full stage-ladder sweep)'
        type: choice
        default: all
        options:
          - all
          - threadbare
          - pilgrim
          - apostate
      runs:
        description: 'Playtest runs per matrix cell (60 = baseline-comparable; lower = faster but directional-only)'
        type: number
        default: 60
      cross_theme_swaps:
        description: 'Allow OUT-OF-THEME swap-ins in measurement arms (owner per-run authorization; evidence only — shipping a recolor stays gated on the color law)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  id-token: write

concurrency:
  group: deck-tuning
  cancel-in-progress: false

jobs:
  deck_tuning:
    uses: ./.github/workflows/_claude-skill.yml
    secrets: inherit
    with:
      extra_claude_args: |
        -p
        --dangerously-skip-permissions
      # Defaults cover the scheduled path (cron re-enable): a bare cron run
      # gets preset=all, runs=60, in-theme-only — the same full sweep as
      # before the inputs existed.
      prompt: "/deck-tuning --preset=${{ inputs.preset || 'all' }} --runs=${{ inputs.runs || 60 }} --cross-theme-swaps=${{ inputs.cross_theme_swaps || false }}"
      timeout_minutes: 90
