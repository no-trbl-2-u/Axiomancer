name: deck-tuning

# Card Forge balance loop: sandbox-first card/deck tuning through the
# playtest matrix; report + changes land on a new branch + PR (never main).
# See .claude/commands/deck-tuning.md. Runs against axiomancer-mechanics.
# Scheduled weekly-staggered so at most one tuning loop runs per day;
# adjust or delete the cron to change cadence.

on:
  # schedule trigger disabled 2026-07-08 (Actions minute budget review) —
  # run manually via workflow_dispatch until next billing cycle.
  # schedule:
  #   - cron: "29 3 * * 1"
  workflow_dispatch:
    inputs:
      preset:
        description: 'Preset to tune (all = full ten-preset sweep)'
        type: choice
        default: all
        options:
          - all
          - erosion
          - oratory
          - foundry
          - penitent
          - standstill
          - augury
          - tithe
          - grace
          - bastion
          - refrain
      runs:
        description: 'Playtest runs per matrix cell (60 = baseline-comparable; lower = faster but directional-only)'
        type: number
        default: 60

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  id-token: write

concurrency:
  group: deck-tuning
  cancel-in-progress: false

jobs:
  deck_tuning:
    uses: ./.github/workflows/_claude-skill.yml
    secrets: inherit
    with:
      extra_claude_args: |
        -p
        --dangerously-skip-permissions
      # Defaults cover the scheduled path (cron re-enable): a bare cron run
      # gets preset=all, runs=60 — the same full sweep as before the inputs.
      prompt: "/deck-tuning --preset=${{ inputs.preset || 'all' }} --runs=${{ inputs.runs || 60 }}"
      timeout_minutes: 90
