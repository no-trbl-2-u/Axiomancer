name: perf-audit

# The weekly performance audit (phase PF1). Measures web load and bundle,
# runtime smoothness on a scripted combat round, and engine speed; appends one
# line to docs/reports/perf/history.jsonl and files a `[perf]` row in
# plan/AUDIT.md (plus its issue) for each budget breach or week-over-week
# drift. Report-only: a number never fails this workflow; only a measurer
# crash does, which is a broken audit worth a red run.
#
# Sunday 07:07 UTC, before the other Sunday checks (07:13 onwards), so it
# never shares a runner window with verify-mobile's export. It joins the
# nexus-loop group so its commit queues behind a loop tick instead of racing
# that tick's push.
#
# First budgets: run it once by hand with `seed_budgets: true`. Budgets are
# seeded on the CI runner, never from a local machine.

on:
  schedule:
    - cron: '7 7 * * 0'
  workflow_dispatch:
    inputs:
      seed_budgets:
        description: 'Write docs/reports/perf/budgets.json from this run'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: nexus-loop
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Measure
        id: measure
        run: |
          if [ "${{ inputs.seed_budgets }}" = "true" ]; then
            npm run perf:audit -- --seed-budgets
          else
            npm run perf:audit
          fi

      - name: Commit the report
        shell: bash
        env:
          GIT_AUTHOR_NAME: claude[bot]
          GIT_AUTHOR_EMAIL: 41898282+claude[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: claude[bot]
          GIT_COMMITTER_EMAIL: 41898282+claude[bot]@users.noreply.github.com
          FINDINGS: ${{ steps.measure.outputs.findings }}
        run: |
          git add -- docs/reports/perf/ plan/AUDIT.md
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "perf: weekly audit $(date -u +%F) — ${FINDINGS:-0} finding(s)"
          branch="${GITHUB_REF_NAME}"
          for delay in 2 4 8 16; do
            git pull --rebase origin "$branch" && git push origin "HEAD:$branch" && exit 0
            git rebase --abort 2>/dev/null || true
            sleep "$delay"
          done
          echo "::error::Could not push the perf report after 4 attempts."
          exit 1
