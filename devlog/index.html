<!doctype html>
<html lang="en">
<head>

<title>Axiomancer DevLog</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #0e1116; --fg: #d7dde5; --fg-strong: #f0f3f7; --muted: #6b7480;
  --accent: #8ab4f8; --panel: #161b22; --border: #222833; --row: #141a22;
  --code-bg: #1b212b; --th: #aeb7c2; --list-head: #9aa4b0;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f7f5ef; --fg: #33302a; --fg-strong: #1a160f; --muted: #6f6656;
    --accent: #3a5db0; --panel: #efece3; --border: #ddd7c9; --row: #efece3;
    --code-bg: #e9e5d9; --th: #5c5344; --list-head: #6f6656;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 42rem; margin: 0 auto; padding: 20px 18px 80px; }
header.top {
  position: sticky; top: 0; z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--border); margin: 0 0 24px;
}
header.top .wrap { padding-top: 14px; padding-bottom: 14px; display: flex; align-items: baseline; gap: 14px; }
header.top a.home, header.top .home { color: var(--accent); text-decoration: none; font-weight: 600; }
header.top .crumb { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
h1, h2, h3, h4 { line-height: 1.25; color: var(--fg-strong); }
h1 { font-size: 26px; margin: 0 0 4px; }
h2 { font-size: 20px; margin: 32px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); scroll-margin-top: 72px; }
h3 { font-size: 17px; margin: 22px 0 8px; scroll-margin-top: 72px; }
a { color: var(--accent); }
code { background: var(--code-bg); padding: 1px 6px; border-radius: 5px; font-size: 0.88em; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
pre { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; overflow-x: auto; }
pre code { background: none; padding: 0; }
table { width: 100%; border-collapse: collapse; margin: 14px 0; display: block; overflow-x: auto; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { background: var(--panel); color: var(--th); font-weight: 600; white-space: nowrap; }
tr:last-child td { border-bottom: none; }
ul, ol { padding-left: 22px; }
li { margin: 4px 0; }
.entry-list { list-style: none; padding: 0; margin: 8px 0 0; }
.entry-list li { margin: 0; border-bottom: 1px solid var(--border); }
.entry-list a { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; padding: 14px 4px; text-decoration: none; color: var(--fg); }
.entry-list a:hover { background: var(--row); }
.entry-list .date { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
.entry-list .head { color: var(--list-head); font-size: 14px; text-align: right; }
.muted { color: var(--muted); }
footer.foot { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header class="top"><div class="wrap"><span class="home">Axiomancer DevLog</span></div></header>
<main class="wrap">
<h1>Axiomancer DevLog</h1>
<p class="muted">1 entry, newest first.</p>
<ul class="entry-list">

</ul>
<footer class="foot">Axiomancer DevLog &middot; generated by <code>scripts/build-devlog.mjs</code></footer>
</main>
</body>
</html>
