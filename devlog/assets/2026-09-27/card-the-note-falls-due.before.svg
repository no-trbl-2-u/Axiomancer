<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400" role="img" aria-label="The Note Falls Due">
  <title>The Note Falls Due</title>
  <desc>🩸 BLEED 6. Afflict DOOM 20. IMMOLATE 4: burn the 4 lowest cards in your hand, then deal 75, Heal 35, draw 3 and gain WRATH 4. Powered by a dead die it deals 55 more and costs 15 more VITAE.</desc>
  <style>
    .plate { fill: #15110c; }
    .name { font-family: Georgia, 'Times New Roman', serif; font-size: 19px; fill: #ece0c8; }
    .free { font-family: ui-monospace, Menlo, monospace; font-size: 13px; fill: #dcb04a; }
    .paid { font-family: Georgia, 'Times New Roman', serif; font-size: 12.5px; fill: rgba(236,224,200,0.78); }
    .note { font-family: ui-monospace, Menlo, monospace; font-size: 10px; fill: #9c937f; }
    .rule { stroke: rgba(236,224,200,0.14); stroke-width: 1; }
  </style>
  <rect class="plate" x="0.5" y="0.5" width="299" height="399" fill="#15110c" stroke="#9a5fd0" stroke-width="2"/>
  <text x="14" y="30" class="name">The Note Falls Due</text>
  <line class="rule" x1="14" y1="52" x2="286" y2="52"/>
  <text x="14" y="78" class="free">🩸 BLEED 6</text>
  <line class="rule" x1="14" y1="94" x2="286" y2="94"/>
  <text x="14" y="116" class="paid">Afflict DOOM 20. IMMOLATE 4: burn the 4</text><text x="14" y="134" class="paid">lowest cards in your hand, then deal</text><text x="14" y="152" class="paid">75, Heal 35, draw 3 and gain WRATH 4.</text><text x="14" y="170" class="paid">Powered by a dead die it deals 55 more</text><text x="14" y="188" class="paid">and costs 15 more VITAE.</text>
  <line class="rule" x1="14" y1="366" x2="286" y2="366"/>
  <text x="14" y="384" class="note">as it stood before</text>
</svg>
